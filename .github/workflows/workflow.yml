name: Main workflow

on:
  workflow_dispatch:
  push:
    branches: "**"
    tags: "**"
  pull_request:

jobs:
  markdownlint:
    name: MarkdownLint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up a supported lint runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Lint README
        run: npx --yes markdownlint-cli@0.49.1 README.md
